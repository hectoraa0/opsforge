name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: pytest -q

  docker-integration:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-only-test-password
      GRAFANA_ADMIN_PASSWORD: ci-only-test-password
    steps:
      - uses: actions/checkout@v4
      - name: Build and start application with PostgreSQL
        run: docker compose up -d --build
      - name: Smoke test running containers
        run: python scripts/smoke_test.py
      - name: Diagnose on failure
        if: failure()
        run: docker compose logs --no-color --tail=100
      - name: Stop and remove CI database
        if: always()
        run: docker compose down -v --remove-orphans
