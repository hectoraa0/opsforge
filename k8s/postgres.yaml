# Local-only database: one replica, persistent PVC, no external exposure.
apiVersion: v1
kind: Service
metadata:
  name: opsforge-db
  namespace: opsforge
  labels:
    app.kubernetes.io/name: opsforge-db
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: opsforge-db
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: opsforge-db
  namespace: opsforge
  labels:
    app.kubernetes.io/name: opsforge-db
spec:
  serviceName: opsforge-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: opsforge-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opsforge-db
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: postgres:17-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_DB
              value: opsforge
            - name: POSTGRES_USER
              value: opsforge
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opsforge-db
                  key: password
          ports:
            - name: postgres
              containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          startupProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U opsforge -d opsforge"]
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U opsforge -d opsforge"]
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U opsforge -d opsforge"]
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: standard
        resources:
          requests:
            storage: 1Gi
